# Rust engine for the VS Code extension (docs/vscode-extension.md). `goku-engine` is the library (no I/O on stdout, no
# VS Code specifics, so the Mac app can link it later); `goku-engine-server` is the stdio JSON-RPC process the extension spawns.
[workspace]
resolver = "3"
members = ["crates/goku-engine", "crates/goku-engine-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
goku-engine = { path = "crates/goku-engine" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-std", "io-util"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
fancy-regex = "0.14"
unicode-segmentation = "1"
# MongoDB: rustls (ring), the hickory resolver for SRV, `tlsCertificateKeyFilePassword` in URIs; bson 3 with Extended JSON for `execute` and the fixtures.
mongodb = { version = "3.9", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls", "dns-resolver", "cert-key-password"] }
bson = { version = "3.1", features = ["serde_json-1"] }
# One crypto provider for every driver (ring); `install_default` runs before any TLS setup.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
