# Builds goku-engine-server for the six VS Code targets and packages one VSIX per target (docs/RELEASING.md).
# release.yml calls it when release-please creates a vX.Y.Z release; run it by hand to get the VSIXs as workflow
# artifacts without publishing. Publishing needs VSCE_PAT (Marketplace) / OVSX_PAT (Open VSX); without them it only
# warns. `prerelease` (default true) packages and publishes as a pre-release.
name: Extension release

on:
  workflow_call:
    inputs:
      ref: { type: string, required: true }
      publish: { type: boolean, default: false }
      prerelease: { type: boolean, default: true }
  workflow_dispatch:
    inputs:
      prerelease: { type: boolean, default: true, description: Package as a pre-release }

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        # targets: <VS Code target>=<Rust target> pairs built on one runner; check: the binary native to the runner, which
        # must start and report its version.
        include:
          # Linux: static musl builds (rustls only), so they run on any distro the remote host has, Alpine included.
          - { name: linux-x64, os: ubuntu-latest, zig: true, targets: linux-x64=x86_64-unknown-linux-musl, check: linux-x64/goku-engine-server }
          - { name: linux-arm64, os: ubuntu-latest, zig: true, targets: linux-arm64=aarch64-unknown-linux-musl }
          # Both macOS targets on one (arm64) runner, x64 cross-compiled: hosted macOS runners are scarce, and a second
          # macOS job can wait in the queue until GitHub cancels it.
          - name: darwin
            os: macos-latest
            targets: darwin-arm64=aarch64-apple-darwin darwin-x64=x86_64-apple-darwin
            check: darwin-arm64/goku-engine-server
          - { name: win32-x64, os: windows-latest, targets: win32-x64=x86_64-pc-windows-msvc, check: win32-x64/goku-engine-server.exe }
          - { name: win32-arm64, os: windows-latest, targets: win32-arm64=aarch64-pc-windows-msvc }
    name: engine (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install the Rust targets
        working-directory: engine
        shell: bash
        run: |
          rustup show
          for pair in ${{ matrix.targets }}; do rustup target add "${pair#*=}"; done
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: ${{ matrix.name }}
      - if: matrix.zig
        run: pip install ziglang && cargo install cargo-zigbuild --locked
      - name: Build
        working-directory: engine
        shell: bash
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then cmd=zigbuild; else cmd=build; fi
          for pair in ${{ matrix.targets }}; do
            target=${pair%%=*} rust=${pair#*=}
            cargo $cmd --release --locked -p goku-engine-server --target "$rust"
            exe=goku-engine-server; [[ "$target" == win32-* ]] && exe=goku-engine-server.exe
            mkdir -p "../out/$target" && cp "target/$rust/release/$exe" "../out/$target/"
          done
      - if: matrix.check
        shell: bash
        run: out/${{ matrix.check }} --version
      # One folder per target (out/<target>/goku-engine-server[.exe]); `package` merges all artifacts into engines/.
      - uses: actions/upload-artifact@v4
        with:
          name: engines-${{ matrix.name }}
          path: out
          if-no-files-found: error

  package:
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          pattern: engines-*
          path: engines
          merge-multiple: true
      - name: Package one VSIX per target
        working-directory: vscode
        env:
          PRE: ${{ inputs.prerelease && 'true' || '' }} # adds --pre-release
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          NODE_ENV=production npm run build
          ../scripts/package-vsix.sh ../engines ../dist ${PRE:+--pre-release}
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist/*.vsix
          if-no-files-found: error
      - name: Publish
        if: inputs.publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          PRE: ${{ inputs.prerelease && '--pre-release' || '' }}
        run: |
          if [ -n "$VSCE_PAT" ]; then npx --yes @vscode/vsce@3 publish $PRE --packagePath dist/*.vsix; else echo "::warning::VSCE_PAT not set: not published to the Marketplace"; fi
          if [ -n "$OVSX_PAT" ]; then for f in dist/*.vsix; do npx --yes ovsx@0 publish "$f" $PRE -p "$OVSX_PAT"; done; else echo "::warning::OVSX_PAT not set: not published to Open VSX"; fi
